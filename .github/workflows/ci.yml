name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact pinned main commit SHA (40 hexadecimal characters)"
        required: true
        type: string
concurrency:
  group: eth-tester-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  cross-platform:
    name: unit-and-qa / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned checkpoint commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python -c "import os,subprocess,re; expected=os.environ['EXPECTED_SHA'].lower(); actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip().lower(); assert re.fullmatch('[0-9a-f]{40}',expected) and actual==expected, f'Checkpoint SHA mismatch or invalid: expected={expected}, actual={actual}'"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q src tests
        if: always()
      - name: Parse Windows installer syntax
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          foreach ($path in @('install/install.ps1', 'install/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parser errors in $path : $($errors -join '; ')"
            }
          }
        continue-on-error: false
      - run: python -m pytest -q -ra -m "not postgres" --junitxml=qa-unit.xml
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-unit-${{ matrix.os }}-py${{ matrix.python }}
          path: qa-unit.xml
          if-no-files-found: warn
  postgres-integration:
    name: real PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ETH_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned checkpoint commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python -c "import os,subprocess,re; expected=os.environ['EXPECTED_SHA'].lower(); actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip().lower(); assert re.fullmatch('[0-9a-f]{40}',expected) and actual==expected, f'Checkpoint SHA mismatch or invalid: expected={expected}, actual={actual}'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Pin trusted PostgreSQL client binaries for native backup tests
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.postgres }}"
          case "$version" in 17|18) ;; *) echo "Unsupported PostgreSQL version" >&2; exit 1 ;; esac
          bin="/usr/lib/postgresql/$version/bin"
          if [[ ! -x "$bin/pg_dump" || ! -x "$bin/pg_restore" ]]; then
            keydir="$(mktemp -d)"
            trap 'rm -rf "$keydir"' EXIT
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$keydir/pgdg.asc"
            fingerprint="$(gpg --show-keys --with-colons "$keydir/pgdg.asc" | awk -F: '$1=="fpr"{print $10; exit}')"
            test "$fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            sudo install -m 0644 "$keydir/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/eth-tester-pgdg.list > /dev/null
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "postgresql-client-$version"
          fi
          for executable in pg_dump pg_restore; do
            test -f "$bin/$executable" && test -x "$bin/$executable"
            test ! -L "$bin/$executable"
            test "$(stat -c %u "$bin/$executable")" = 0
            "$bin/$executable" --version | grep -F "PostgreSQL) $version."
          done
          echo "ETH_TESTER_PG_BIN_DIR=$bin" >> "$GITHUB_ENV"
      - name: Real PostgreSQL - Data, Storage, Analytics, Simulation and ML
        run: python -m pytest -q -ra tests/integration tests/test_storage_postgres.py tests/test_strategy_postgres.py tests/test_learning_postgres.py --junitxml=qa-postgres-${{ matrix.postgres }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-postgresql-${{ matrix.postgres }}
          path: qa-postgres-${{ matrix.postgres }}.xml
          if-no-files-found: warn
