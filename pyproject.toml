[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eth-tester"
version = "0.1.0"
description = "ETHUSDT Bybit data collector and paper-trading laboratory"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1","psycopg[binary]>=3.2,<4","websockets>=13,<17","pydantic-settings>=2.6,<3","matplotlib>=3.9,<4","python-telegram-bot>=21,<23"]

[project.optional-dependencies]
dev = ["pytest>=8,<10","ruff>=0.9,<1"]

[project.scripts]
eth-tester = "eth_tester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_tester"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4","E7","E9","F"]
